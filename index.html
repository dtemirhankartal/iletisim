<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ed" />
    <meta name="description" content="Emirhan Kartal — randevu, yol tarifi ve iletişim bağlantıları." />
    <title>Emirhan Kartal | Bağlantılar</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --espresso: #f6ead9;
        --cocoa: #d1aa78;
        --gold: #c8a16b;
        --sand: #4b301f;
        --paper: #20140f;
        --sage: #9b875e;
        --line: rgba(234, 205, 161, .2);
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; background: var(--paper); }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--espresso);
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% -20%, rgba(126, 76, 40, .6), transparent 38rem),
          radial-gradient(circle at 110% 80%, rgba(99, 58, 32, .35), transparent 34rem),
          var(--paper);
      }

      .leaves { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; opacity: .43; }
      .branch { position: absolute; width: 240px; height: 620px; }
      .branch::before { content: ""; position: absolute; width: 2px; height: 610px; background: var(--sage); border-radius: 100%; transform: rotate(-20deg); left: 112px; top: 0; box-shadow: 0 0 8px rgba(208, 170, 106, .25); }
      .branch span { position: absolute; width: 20px; height: 58px; background: linear-gradient(130deg, #b29b69, #75613f); border-radius: 100% 0 100% 0; transform-origin: center bottom; }
      .branch.left { left: -96px; top: 9vh; transform: rotate(-22deg); }
      .branch.right { right: -96px; top: 25vh; transform: scaleX(-1) rotate(-15deg); }
      .branch span:nth-child(1) { left: 56px; top: 55px; transform: rotate(-47deg); }
      .branch span:nth-child(2) { left: 132px; top: 115px; transform: rotate(57deg); }
      .branch span:nth-child(3) { left: 42px; top: 175px; transform: rotate(-52deg); }
      .branch span:nth-child(4) { left: 147px; top: 238px; transform: rotate(58deg); }
      .branch span:nth-child(5) { left: 45px; top: 300px; transform: rotate(-53deg); }
      .branch span:nth-child(6) { left: 150px; top: 365px; transform: rotate(59deg); }
      .branch span:nth-child(7) { left: 49px; top: 431px; transform: rotate(-50deg); }
      .branch span:nth-child(8) { left: 151px; top: 495px; transform: rotate(58deg); }

      main { width: min(100%, 510px); margin: 0 auto; padding: clamp(34px, 8vh, 72px) 24px 42px; }
      .hero { text-align: center; margin-bottom: 34px; }
      .logo-shell {
        width: 209px; height: 160px; margin: 0 auto 18px; display: grid; place-items: center;
        filter: drop-shadow(0 10px 14px rgba(61, 42, 27, .12));
      }
      .logo-shell img { width: 218px; max-height: 164px; object-fit: contain; }
      h1 { margin: 0; color: var(--gold); font-family: "Plus Jakarta Sans", "DM Sans", ui-sans-serif, sans-serif; font-size: 1.7rem; font-weight: 700; letter-spacing: -.035em; }
      .welcome { margin: 10px 0 0; color: #ddc8aa; font-size: .96rem; font-weight: 500; }
      .rule { width: 48px; height: 2px; margin: 15px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

      nav { display: grid; gap: 13px; }
      .link-card {
        position: relative; display: flex; align-items: center; gap: 15px; min-height: 82px; padding: 15px 17px;
        color: var(--espresso); text-decoration: none; border: 1px solid var(--line); border-radius: 18px;
        background: linear-gradient(135deg, rgba(77, 47, 30, .92), rgba(49, 29, 20, .9)); box-shadow: 0 10px 26px rgba(0, 0, 0, .2);
        transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      }
      .link-card:hover, .link-card:focus-visible { transform: translateY(-3px); border-color: rgba(218, 174, 112, .68); box-shadow: 0 14px 28px rgba(0, 0, 0, .35); outline: none; }
      .icon {
        flex: 0 0 48px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px;
        color: #fff8ed; background: linear-gradient(145deg, #a77c52, #704729); box-shadow: inset 0 1px rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.18);
      }
      .icon.map { background: #fffdf9; }
      .icon.doctortakvimi { background: #fffdf9; }
      .icon.whatsapp { background: #25d366; }
      .icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
      .icon img { display: block; width: 32px; height: 32px; object-fit: contain; }
      .copy { flex: 1; line-height: 1.35; font-size: 1rem; font-weight: 600; }
      .arrow { color: var(--gold); font-size: 1.6rem; font-weight: 300; transition: transform .2s ease; }
      .link-card:hover .arrow { transform: translateX(3px); }
      footer { margin-top: 31px; color: #b9a182; text-align: center; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>

  </body>
</html>
